<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 535" width="1160" height="535" font-size="13px">
<style>
  @font-face {
    font-family: 'ConsolasFallback';
    src: local('Consolas'), local('Consolas Bold');
    font-display: swap;
    -webkit-size-adjust: 109%;
    size-adjust: 109%;
  }
  .font-mono {
    font-family: ConsolasFallback, Consolas, 'SF Mono', Monaco, Menlo, 'Liberation Mono', monospace;
  }
  .key { fill: #5b4fcf; }
  .val { fill: #1a1a2e; }
  .add { fill: #1a7f37; }
  .cc  { fill: #8a9aac; }
  .ascii { fill: #57606a; }
  .hdr { fill: #1f2328; font-weight: 600; }
  text, tspan { white-space: pre; }

  /* CRT Electron Beam Scanline Animation over Letter K */
  @keyframes crtBeamLight {
    0%, 100% {
      fill: #57606a;
      opacity: 0.8;
    }
    14% {
      fill: #1a7f37;
      opacity: 1;
      filter: drop-shadow(0 0 3px rgba(26, 127, 55, 0.5));
    }
    28% {
      fill: #24292f;
      opacity: 0.95;
    }
  }

  @keyframes cursorBlinkLight {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .k-line {
    animation: crtBeamLight 3.6s ease-in-out infinite;
  }
  .k-0  { animation-delay: 0.00s; }
  .k-1  { animation-delay: 0.08s; }
  .k-2  { animation-delay: 0.16s; }
  .k-3  { animation-delay: 0.24s; }
  .k-4  { animation-delay: 0.32s; }
  .k-5  { animation-delay: 0.40s; }
  .k-6  { animation-delay: 0.48s; }
  .k-7  { animation-delay: 0.56s; }
  .k-8  { animation-delay: 0.64s; }
  .k-9  { animation-delay: 0.72s; }
  .k-10 { animation-delay: 0.80s; }
  .k-11 { animation-delay: 0.88s; }
  .k-12 { animation-delay: 0.96s; }
  .k-13 { animation-delay: 1.04s; }
  .k-14 { animation-delay: 1.12s; }
  .k-15 { animation-delay: 1.20s; }
  .k-16 { animation-delay: 1.28s; }
  .k-17 { animation-delay: 1.36s; }
  .k-18 { animation-delay: 1.44s; }

  .term-cursor {
    animation: cursorBlinkLight 1s step-end infinite;
    fill: #1a7f37;
  }
</style>

<!-- Card Surface -->
<rect width="1160" height="535" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

