<tspan x="42" y="443.0" class="k-line k-17">           =####+   =######+        =#######+   =*###*            </tspan>
<tspan x="42" y="461.5" class="k-line k-18">             +=     =******=          +******+     +=             </tspan>
<tspan x="42" y="480.0">  [SYSTEM_STATUS: ONLINE] <tspan class="term-cursor">█</tspan>                               </tspan>
</text>

<!-- Section Dividers (Flush with text right edge) -->
<line x1="800" y1="31" x2="1115" y2="31" stroke="#d0d7de" stroke-width="1"/>
<line x1="715" y1="281" x2="1115" y2="281" stroke="#d0d7de" stroke-width="1"/>
<line x1="755" y1="426" x2="1115" y2="426" stroke="#d0d7de" stroke-width="1"/>

